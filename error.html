<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden</title>
  <link rel="stylesheet" href="/responsive.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #111827;
      color: #f8fafc;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      text-align: center;
      background: #1f2937;
      border-radius: 20px;
      padding: 32px;
    }
    a { color: #7dd3fc; }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
        min-height: 100dvh;
      }
      .card {
        max-width: 100%;
        padding: 24px 16px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.95rem;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 12px;
        min-height: 100dvh;
      }
      .card {
        padding: 16px 12px;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 10px;
      }
      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404 – Seite nicht gefunden</h1>
    <p>Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
    <p><a href="/">Zur Startseite</a></p>
  </main>
</body>
</html>
