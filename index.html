<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datascience Seminar</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/responsive.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-end: #1e293b;
      --panel: #111827;
      --panel-alpha: rgba(17, 24, 39, 0.9);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --border: rgba(255,255,255,0.12);
      --control-border: rgba(255,255,255,0.2);
      --control-hover: rgba(255,255,255,0.08);
      --shadow: rgba(0,0,0,0.25);
    }
    body.light {
      color-scheme: light;
      --bg: #eef4fa;
      --bg-end: #dce8f5;
      --panel: #ffffff;
      --panel-alpha: rgba(255,255,255,0.94);
      --text: #172033;
      --muted: #475569;
      --accent: #1769b0;
      --accent-2: #5b55c9;
      --border: rgba(30,64,110,0.14);
      --control-border: #b8c5d4;
      --control-hover: #e7eef7;
      --shadow: rgba(30,64,110,0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg-end));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      padding: 32px 0;
    }
    .card { margin: auto 0; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; justify-content: center; }
    .button.powerpoint { background: linear-gradient(90deg, #d24726, #f18f01); color: white; }
    .button.powerpoint:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .button.powerpoint.secondary { background: transparent; border-color: #f18f01; color: white; }
    .button.powerpoint.secondary:hover { background: rgba(241, 143, 1, 0.15); }
    body.light .button.powerpoint.secondary { color: #a84b00; }
    .language-toggle {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .language-toggle button {
      border: 1px solid var(--control-border);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .language-toggle button:hover {
      background: var(--control-hover);
    }
    a.button {
      display: inline-block;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      transition: transform 0.2s ease;
    }
    a.button:hover { transform: translateY(-2px); }
    a.button.secondary {
      background: transparent;
      border: 1px solid var(--control-border);
      color: var(--text);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .card {
        width: 100%;
        padding: 24px 0;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 0.95rem;
      }
      .actions {
        flex-direction: column;
        gap: 10px;
      }
      a.button {
        width: 100%;
        text-align: center;
        padding: 14px 16px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        min-height: 100dvh;
      }
      .card {
        padding: 16px 0;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
      }
      a.button {
        padding: 12px 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="Datascience Seminar – Startseite">
      <img src="/favicon.png" alt="" />
      <span class="site-logo-text">Datascience<span>Seminar</span></span>
    </a>
    <button class="site-theme-toggle" id="theme" type="button" aria-label="Light Mode aktivieren" title="Light Mode aktivieren">&#9728;&#65039;</button>
  </header>
  <main class="card">
    <h1>Welcome to the Datascience Seminar</h1>
    <p>This demo provides an interactive introduction to search algorithms.</p>

    <div class="actions">
      <a class="button" href="/DijkstraA/">Go to the Dijkstra/A* example</a>
      <a class="button secondary" href="/Datascience_Projekt%20(13).pdf" download="Current_Paper.pdf">Download current paper</a>
      <a class="button powerpoint" href="https://1drv.ms/p/c/ce9f3197ab2af297/IQBs65Z07sb7QoUPpoOQToKIAXlUGvcXHBHZ4poMEWfKeKE">Open PowerPoint</a>
      <a class="button powerpoint secondary" href="https://1drv.ms/p/c/ce9f3197ab2af297/IQBs65Z07sb7QoUPpoOQToKIAXlUGvcXHBHZ4poMEWfKeKE" target="_blank" rel="noopener noreferrer">Open PowerPoint in new tab</a>
    </div>
  </main>
  <script>
    (function () {
      const button = document.getElementById('theme');

      function setTheme(light) {
        document.body.classList.toggle('light', light);
        button.textContent = light ? '\uD83C\uDF19' : '\u2600\uFE0F';
        const nextTheme = light ? 'Dark Mode' : 'Light Mode';
        button.setAttribute('aria-label', nextTheme + ' aktivieren');
        button.title = nextTheme + ' aktivieren';
      }

      setTheme(localStorage.getItem('theme') === 'light');
      button.addEventListener('click', function () {
        const light = !document.body.classList.contains('light');
        setTheme(light);
        localStorage.setItem('theme', light ? 'light' : 'dark');
      });
    }());
  </script>
</body>
</html>
