<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darascience Seminar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    a.button {
      display: inline-block;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      transition: transform 0.2s ease;
    }
    a.button:hover { transform: translateY(-2px); }
    a.button.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Willkommen zum Darascience Seminar</h1>
    <p>Diese kleine Demo zeigt einen interaktiven Einstieg in Suchalgorithmen und einen weiteren Bereich für den YUM-Algorithmus.</p>
    <div class="actions">
      <a class="button" href="/DijkstraA/">Zum Dijkstra-/A*-Beispiel</a>
      <a class="button secondary" href="/yum-algorithm.html">YUM Algorithmus</a>
    </div>
  </main>
</body>
</html>
