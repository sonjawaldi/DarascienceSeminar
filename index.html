<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datascience Seminar</title>
  <link rel="stylesheet" href="/responsive.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; justify-content: center; }
    .button.powerpoint { background: linear-gradient(90deg, #d24726, #f18f01); color: white; }
    .button.powerpoint:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .button.powerpoint.secondary { background: transparent; border-color: #f18f01; color: white; }
    .button.powerpoint.secondary:hover { background: rgba(241, 143, 1, 0.15); }
    .language-toggle {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .language-toggle button {
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .language-toggle button:hover {
      background: rgba(255,255,255,0.08);
    }
    a.button {
      display: inline-block;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      transition: transform 0.2s ease;
    }
    a.button:hover { transform: translateY(-2px); }
    a.button.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .card {
        width: 100%;
        padding: 24px 16px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 0.95rem;
      }
      .actions {
        flex-direction: column;
        gap: 10px;
      }
      a.button {
        width: 100%;
        text-align: center;
        padding: 14px 16px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        min-height: 100dvh;
      }
      .card {
        padding: 16px 12px;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
      }
      a.button {
        padding: 12px 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to the Datascience Seminar</h1>
    <p>This demo provides an interactive introduction to search algorithms.</p>

    <div class="actions">
      <a class="button" href="/DijkstraA/">Go to the Dijkstra/A* example</a>
      <a class="button powerpoint" href="https://1drv.ms/p/c/ce9f3197ab2af297/IQBs65Z07sb7QoUPpoOQToKIAXlUGvcXHBHZ4poMEWfKeKE">Open PowerPoint</a>
      <a class="button powerpoint secondary" href="https://1drv.ms/p/c/ce9f3197ab2af297/IQBs65Z07sb7QoUPpoOQToKIAXlUGvcXHBHZ4poMEWfKeKE" target="_blank" rel="noopener noreferrer">Open PowerPoint in new tab</a>
    </div>
  </main>
</body>
</html>
